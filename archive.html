<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史归档 - 每日全球新闻简报</title>
    <style>
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #e94560;
            --accent2: #0f3460;
            --text: #eee;
            --text-muted: #aab;
            --bg: #0f0f1a;
            --card-bg: #1a1a2e;
            --border: #2a2a4a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
        }
        .header {
            background: linear-gradient(135deg, var(--primary), var(--accent2));
            padding: 40px 20px;
            text-align: center;
            border-bottom: 3px solid var(--accent);
        }
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .header .subtitle {
            color: var(--text-muted);
            font-size: 0.95em;
        }
        .nav-link {
            display: inline-block;
            margin-top: 14px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.95em;
            border: 1px solid var(--accent);
            padding: 6px 18px;
            border-radius: 20px;
            transition: background 0.2s, color 0.2s;
        }
        .nav-link:hover {
            background: var(--accent);
            color: white;
        }
        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .archive-list {
            list-style: none;
        }
        .archive-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 28px;
            margin-bottom: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .archive-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(233, 69, 96, 0.15);
        }
        .archive-item a {
            color: var(--text);
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .archive-item .date {
            font-size: 1.1em;
            font-weight: bold;
        }
        .archive-item .arrow {
            color: var(--accent);
            font-size: 1.3em;
        }
        .footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
            font-size: 0.82em;
            border-top: 1px solid var(--border);
            margin-top: 30px;
        }
        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 60px 20px;
            font-size: 1.05em;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>历史归档</h1>
    <div class="subtitle">每日全球新闻简报 · 往期回顾</div>
    <a href="index.html" class="nav-link">← 返回最新简报</a>
</div>

<div class="container">
    <ul class="archive-list" id="archive-list">
        <!-- ARCHIVE_ENTRIES -->
        <li class="archive-item">
            <a href="archive/2026-03-19.html">
                <span class="date">2026年3月19日</span>
                <span class="arrow">→</span>
            </a>
        </li>
        <li class="archive-item">
            <a href="archive/2026-03-18.html">
                <span class="date">2026年3月18日</span>
                <span class="arrow">→</span>
            </a>
        </li>
        <!-- /ARCHIVE_ENTRIES -->
    </ul>
</div>

<div class="footer">
    <p>每日全球新闻简报 · Powered by GitHub Pages</p>
</div>

</body>
</html>
